[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "visionapp-engine"
version = "0.1.0"
description = "Local, typed vision pipelines with a native Mac application"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "httpx>=0.28,<1", "pillow>=11,<13", "numpy>=2,<3",
  "mcp>=1.26,<2", "pydantic-ai-slim[openai]>=1.0,<2",
  "opencv-python-headless>=4.10,<5", "filelock>=3.16,<5",
  "paho-mqtt>=2.1,<3", "keyring>=25,<27",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9", "mypy>=1.15"]
vision = ["torch>=2.6,<3", "transformers>=4.48,<5", "scipy>=1.14,<2", "torchvision>=0.21,<1", "safetensors>=0.5,<1", "onnxruntime==1.31.1"]

[project.scripts]
vision-engine = "engine.api.__main__:main"
vision-mcp = "mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["spec", "engine", "agent", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

